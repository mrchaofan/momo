<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <style>
    text { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 13.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #57606a; }
    .t { font-size: 11px; }
    .n { font-size: 12px; font-weight: 700; }
    .arr { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .ln { stroke: #8c959f; stroke-width: 1; fill: none; }
    .w { fill: #ffffff; stroke: #4c7bd9; }
    .e { fill: #ffffff; stroke: #7a61b8; }
    .r { fill: #ffffff; stroke: #3e9a5b; }
    .l { fill: #ffffff; stroke: #d98a2b; }
    .c { fill: #ffffff; stroke: #57606a; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <text x="500" y="28" text-anchor="middle" class="title">Framework：三棵树 + 合成层，每帧映射成引擎的 LayerTree</text>

  <!-- column panels -->
  <rect x="15" y="44" width="185" height="272" rx="10" fill="#e8f1ff" stroke="#4c7bd9"/>
  <rect x="210" y="44" width="200" height="272" rx="10" fill="#f1eef8" stroke="#7a61b8"/>
  <rect x="420" y="44" width="190" height="272" rx="10" fill="#eaf7ee" stroke="#3e9a5b"/>
  <rect x="620" y="44" width="175" height="272" rx="10" fill="#fff3e3" stroke="#d98a2b"/>
  <rect x="815" y="44" width="170" height="272" rx="10" fill="#f6f8fa" stroke="#57606a"/>
  <text x="27" y="66" class="h">Widget（不可变配置）</text>
  <text x="222" y="66" class="h">Element（持久节点）</text>
  <text x="432" y="66" class="h">RenderObject（布局/绘制）</text>
  <text x="632" y="66" class="h">Layer（TS 合成层）</text>
  <text x="827" y="66" class="h">LayerTree（C++）</text>

  <!-- Widget tree -->
  <g>
    <path class="ln" d="M32,100 V244 M32,128 H44 M32,156 H44 M32,184 H44 M32,212 H44 M32,240 H44"/>
    <rect x="25" y="78" width="165" height="22" rx="4" class="w"/><text x="32" y="93" class="t">CounterPage（Stateful）</text>
    <rect x="44" y="117" width="140" height="22" rx="4" class="w"/><text x="51" y="132" class="t">Scaffold</text>
    <rect x="44" y="145" width="140" height="22" rx="4" class="w"/><text x="51" y="160" class="t">Center</text>
    <rect x="44" y="173" width="140" height="22" rx="4" class="w"/><text x="51" y="188" class="t">Column</text>
    <rect x="44" y="201" width="140" height="22" rx="4" class="w"/><text x="51" y="216" class="t">Text("3")</text>
    <rect x="44" y="229" width="140" height="22" rx="4" class="w"/><text x="51" y="244" class="t">ElevatedButton</text>
    <text x="27" y="276" class="s">build() 每次返回新对象</text>
    <text x="27" y="293" class="s">canUpdate = 构造函数相同</text>
    <text x="27" y="308" class="s">且 key 相等</text>
  </g>
  <!-- Element tree -->
  <g>
    <path class="ln" d="M227,100 V244 M227,128 H239 M227,156 H239 M227,184 H239 M227,212 H239 M227,240 H239"/>
    <rect x="220" y="78" width="180" height="22" rx="4" class="e"/><text x="227" y="93" class="t">StatefulElement + State</text>
    <rect x="239" y="117" width="160" height="22" rx="4" class="e"/><text x="246" y="132" class="t">ComponentElement</text>
    <rect x="239" y="145" width="160" height="22" rx="4" class="e"/><text x="246" y="160" class="t">RenderObjectElement</text>
    <rect x="239" y="173" width="160" height="22" rx="4" class="e"/><text x="246" y="188" class="t">MultiChildRenderObj…</text>
    <rect x="239" y="201" width="160" height="22" rx="4" class="e"/><text x="246" y="216" class="t">…（复用，只更新 widget）</text>
    <rect x="239" y="229" width="160" height="22" rx="4" class="e"/><text x="246" y="244" class="t">…</text>
    <text x="222" y="276" class="s">setState → markNeedsBuild</text>
    <text x="222" y="293" class="s">BuildOwner.scheduleBuildFor</text>
    <text x="222" y="308" class="s">updateChild 做 diff 与复用</text>
  </g>
  <!-- Render tree -->
  <g>
    <path class="ln" d="M437,100 V244 M437,128 H449 M437,156 H449 M437,184 H449 M437,212 H449 M437,240 H449"/>
    <rect x="430" y="78" width="170" height="22" rx="4" class="r"/><text x="437" y="93" class="t">RenderView（根）</text>
    <rect x="449" y="117" width="150" height="22" rx="4" class="r"/><text x="456" y="132" class="t">RenderPositionedBox</text>
    <rect x="449" y="145" width="150" height="22" rx="4" class="r"/><text x="456" y="160" class="t">RenderFlex</text>
    <rect x="449" y="173" width="150" height="22" rx="4" class="r"/><text x="456" y="188" class="t">RenderParagraph</text>
    <rect x="449" y="201" width="150" height="22" rx="4" class="r"/><text x="456" y="216" class="t">RenderRepaintBoundary</text>
    <rect x="449" y="229" width="150" height="22" rx="4" class="r"/><text x="456" y="244" class="t">RenderDecoratedBox</text>
    <text x="432" y="276" class="s">约束下行 · 尺寸上行 · 单遍</text>
    <text x="432" y="293" class="s">relayout / repaint boundary</text>
    <text x="432" y="308" class="s">截断脏标记的向上传播</text>
  </g>
  <!-- TS Layer tree -->
  <g>
    <path class="ln" d="M637,100 V216 M637,128 H649 M637,156 H649 M637,212 H649 M655,167 V184 M655,184 H667"/>
    <rect x="630" y="78" width="155" height="22" rx="4" class="l"/><text x="637" y="93" class="t">TransformLayer（×dpr）</text>
    <rect x="649" y="117" width="136" height="22" rx="4" class="l"/><text x="656" y="132" class="t">PictureLayer</text>
    <rect x="649" y="145" width="136" height="22" rx="4" class="l"/><text x="656" y="160" class="t">OffsetLayer（边界）</text>
    <rect x="667" y="173" width="118" height="22" rx="4" class="l"/><text x="674" y="188" class="t">PictureLayer</text>
    <rect x="649" y="201" width="136" height="22" rx="4" class="l"/><text x="656" y="216" class="t">PictureLayer</text>
    <text x="632" y="276" class="s">PaintingContext 按需录制</text>
    <text x="632" y="293" class="s">Picture = 不可变 DisplayList</text>
    <text x="632" y="308" class="s">干净的边界直接复用旧层</text>
  </g>
  <!-- C++ LayerTree -->
  <g>
    <path class="ln" d="M832,100 V216 M832,128 H844 M832,156 H844 M832,212 H844 M850,167 V184 M850,184 H862"/>
    <rect x="825" y="78" width="150" height="22" rx="4" class="c"/><text x="832" y="93" class="t">TransformLayer</text>
    <rect x="844" y="117" width="131" height="22" rx="4" class="c"/><text x="851" y="132" class="t">PictureLayer</text>
    <rect x="844" y="145" width="131" height="22" rx="4" class="c"/><text x="851" y="160" class="t">OffsetLayer</text>
    <rect x="862" y="173" width="113" height="22" rx="4" class="c"/><text x="869" y="188" class="t">PictureLayer</text>
    <rect x="844" y="201" width="131" height="22" rx="4" class="c"/><text x="851" y="216" class="t">PictureLayer</text>
    <text x="827" y="276" class="s">SceneBuilder 每帧新建</text>
    <text x="827" y="293" class="s">DisplayList 以 shared_ptr</text>
    <text x="827" y="308" class="s">在帧间共享，不拷贝</text>
  </g>
  <g>
    <line x1="200" y1="160" x2="208" y2="160" class="arr" marker-end="url(#a)"/>
    <line x1="410" y1="160" x2="418" y2="160" class="arr" marker-end="url(#a)"/>
    <line x1="610" y1="160" x2="618" y2="160" class="arr" marker-end="url(#a)"/>
    <line x1="795" y1="160" x2="813" y2="160" class="arr" marker-end="url(#a)"/>
  </g>

  <!-- phases -->
  <text x="15" y="350" class="h">WidgetsBinding.drawFrame()（window.onDrawFrame 中执行）</text>
  <g>
    <rect x="15" y="362" width="150" height="64" rx="8" fill="#f1eef8" stroke="#7a61b8"/>
    <text x="25" y="382" class="n">① buildScope</text><text x="25" y="400" class="s">重建脏 Element（浅→深）</text><text x="25" y="416" class="s">State.build → diff</text>
    <line x1="165" y1="394" x2="177" y2="394" class="arr" marker-end="url(#a)"/>
    <rect x="179" y="362" width="150" height="64" rx="8" fill="#eaf7ee" stroke="#3e9a5b"/>
    <text x="189" y="382" class="n">② flushLayout</text><text x="189" y="400" class="s">脏节点按深度排序</text><text x="189" y="416" class="s">从 relayout 边界重排</text>
    <line x1="329" y1="394" x2="341" y2="394" class="arr" marker-end="url(#a)"/>
    <rect x="343" y="362" width="150" height="64" rx="8" fill="#eaf7ee" stroke="#3e9a5b"/>
    <text x="353" y="382" class="n">③ CompositingBits</text><text x="353" y="400" class="s">哪些子树需要</text><text x="353" y="416" class="s">独立合成层</text>
    <line x1="493" y1="394" x2="505" y2="394" class="arr" marker-end="url(#a)"/>
    <rect x="507" y="362" width="150" height="64" rx="8" fill="#eaf7ee" stroke="#3e9a5b"/>
    <text x="517" y="382" class="n">④ flushPaint</text><text x="517" y="400" class="s">重绘脏 repaint 边界</text><text x="517" y="416" class="s">Canvas → DisplayList</text>
    <line x1="657" y1="394" x2="669" y2="394" class="arr" marker-end="url(#a)"/>
    <rect x="671" y="362" width="150" height="64" rx="8" fill="#fff3e3" stroke="#d98a2b"/>
    <text x="681" y="382" class="n">⑤ compositeFrame</text><text x="681" y="400" class="s">layer.addToScene(b)</text><text x="681" y="416" class="s">push* / addPicture / pop</text>
    <line x1="821" y1="394" x2="833" y2="394" class="arr" marker-end="url(#a)"/>
    <rect x="835" y="362" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#57606a"/>
    <text x="845" y="382" class="n">⑥ window.render</text><text x="845" y="400" class="s">Scene → LayerTree</text><text x="845" y="416" class="s">交给 Animator</text>
  </g>
  <rect x="15" y="440" width="970" height="66" rx="8" fill="#fffbea" stroke="#d4a72c"/>
  <text x="27" y="460" class="t">之后 buildOwner.finalizeTree() 卸载本帧不再使用的 Element；布局变化后再登记一个 post-frame 回调刷新 hover 状态。</text>
  <text x="27" y="478" class="t">onBeginFrame 早于这一切：SchedulerBinding 先执行 transient 回调（Ticker → AnimationController），动画值更新后才进入 build。</text>
  <text x="27" y="496" class="t">JS 侧的 Layer 树会保留到下一帧，引擎侧的 LayerTree 每帧重新组装；两者通过 SceneBuilder 一一对应。</text>
</svg>
